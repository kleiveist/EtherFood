name: Funktion vorschlagen
description: Eine klar begrenzte Verbesserung für EtherFood vorschlagen
title: "[Funktion]: "
body:
  - type: markdown
    attributes:
      value: |
        Beschreibe zuerst das zugrunde liegende Problem und danach eine mögliche Umsetzung.
        EtherFood bevorzugt nachvollziehbare, begrenzte, plattformübergreifende und abhängigkeitssparsame Lösungen.
  - type: dropdown
    id: area
    attributes:
      label: Betroffener Bereich
      description: Wähle den Bereich, der die Funktion besitzen würde.
      options:
        - Installation oder Diagnose
        - Python-Werkzeuge oder Prüfungen
        - Godot-Laufzeit oder Eingabe
        - Export- oder Veröffentlichungswerkzeuge
        - GitHub Actions
        - Dokumentation
        - Bereichsübergreifende Repository-Regel
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem oder Anwendungsfall
      description: Erkläre, wer in welchem Ablauf blockiert ist und warum der aktuelle Stand nicht genügt.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Vorgeschlagene Funktion
      description: Beschreibe das kleinste Ergebnis, das zum dokumentierten Projektumfang passt.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Geprüfte Alternativen
      description: Beschreibe Umgehungen, vorhandene Werkzeuge oder den Verzicht auf eine Änderung samt Nachteilen.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Abnahmekriterien
      description: Nenne sichtbares Verhalten, Plattformen, Tests und notwendige Dokumentation.
      placeholder: |
        - [ ] Sichtbares Ergebnis
        - [ ] Verhalten unter Linux, Windows und macOS bedacht
        - [ ] Tests und Dokumentation aktualisiert
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risiken und Abhängigkeiten
      description: Nenne Kompatibilität, Sicherheit, Wartung, Migration und neue Abhängigkeiten.
  - type: checkboxes
    id: readiness
    attributes:
      label: Prüfung vor dem Absenden
      options:
        - label: Ich habe offene und geschlossene Issues nach diesem Vorschlag durchsucht.
          required: true
        - label: Der Vorschlag passt zu Umfang und Konzeptstand von EtherFood.
          required: true
        - label: Ich habe Alternativen und eine sichtbare Abschlussgrenze beschrieben.
          required: true
