name: Fehler melden
description: Einen reproduzierbaren Fehler in EtherFood melden
title: "[Fehler]: "
body:
  - type: markdown
    attributes:
      value: |
        Danke, dass du hilfst, EtherFood zu verbessern.
        Melde Sicherheitslücken nicht hier, sondern über den [vertraulichen Sicherheitsbericht](https://github.com/kleiveist/EtherFood/security/advisories/new).
  - type: dropdown
    id: area
    attributes:
      label: Betroffener Bereich
      description: Wähle die am besten passende Komponente.
      options:
        - Installation oder Diagnose
        - Python-Werkzeuge oder Prüfungen
        - Godot-Laufzeit oder Eingabe
        - Export- oder Veröffentlichungswerkzeuge
        - GitHub Actions
        - Dokumentation
        - Anderer Repository-Bereich
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version oder Commit
      description: Nenne eine Veröffentlichung oder die vollständige Commit-SHA.
      placeholder: v0.1.0 oder 0123456789abcdef...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Umgebung
      description: Nenne bei Bedarf Betriebssystem, Architektur, Python- und Godot-Version.
      placeholder: Windows 11 x86-64, Python 3.11.9, Godot 4.7.2
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Schritte zur Reproduktion
      description: Beschreibe die kleinste eindeutige Folge und den nötigen Ausgangszustand.
      placeholder: |
        1. Mit einem sauberen Checkout beginnen ...
        2. ... ausführen.
        3. ... beobachten.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
      description: Beschreibe das erwartete Ergebnis und warum.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Verhalten
      description: Beschreibe das Ergebnis einschließlich stabiler Fehlermeldung und Rückgabecode.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevante Protokolle
      description: Entferne Token, Zugangsdaten, persönliche Daten und fremde Geheimnisse.
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Zusätzlicher Zusammenhang
      description: Ergänze Bilder, vermutete Ursachen, Umgehungen oder Regressionshinweise.
  - type: checkboxes
    id: readiness
    attributes:
      label: Prüfung vor dem Absenden
      options:
        - label: Ich habe offene und geschlossene Issues nach diesem Fehler durchsucht.
          required: true
        - label: Ich kann den Fehler mit der genannten Version oder dem Commit reproduzieren.
          required: true
        - label: Diese öffentliche Meldung enthält keine Sicherheitslücke und keine Geheimnisse.
          required: true
